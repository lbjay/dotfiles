# ~/.config/tmux/tmux.conf
# Parallel tmux setup for Ghostty + Claude Code, mirroring GNU screen ergonomics.
# gnome-terminal + screen remain the untouched daily driver.
# Verified target: tmux 3.7b.

# --- Prefix / muscle memory (mirror the `se` alias: screen -e^Ee) ---
set -g prefix C-e
unbind C-b
bind e send-prefix          # C-e e  -> literal C-e to the app (readline end-of-line)
bind C-e last-window        # C-e C-e -> toggle previous window

# Ctrl-held variants (screen binds both plain and ^X forms; tmux only plain)
bind C-c new-window         # C-e C-c -> new window
bind C-n next-window        # C-e C-n -> next window
bind C-p previous-window    # C-e C-p -> previous window
bind C-d detach-client      # C-e C-d -> detach

# --- Terminal / truecolor (Ghostty reports TERM=xterm-ghostty) ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-ghostty:RGB"

# --- Claude Code compatibility (official Claude Code tmux settings) ---
set -g allow-passthrough on            # notifications + progress bar reach outer term
set -s extended-keys on                # distinguish Shift+Enter from Enter
set -as terminal-features 'xterm*:extkeys'
set -sg escape-time 0                  # kill Esc-key latency

# --- Behavior ---
set -g history-limit 10000             # screen: defscrollback 10000
set -g visual-bell off                 # screen: vbell off
set -g set-titles on                   # screen: termcapinfo hs/ts/fs/ds
set -g set-titles-string "#(whoami)@#H | #I | #W"   # reconstructed screen defhstatus
setw -g automatic-rename on
setw -g automatic-rename-format '#{pane_current_command}:#{b:pane_current_path}'
setw -g mode-keys vi                   # vi keys in copy mode

# --- Status line: minimal, screen-like; retain window flags (incl. Z zoom) ---
set -g status-justify left
set -g status-style fg=black,bg=white
set -g status-left ' %m%d %H:%M | '    # strftime, mirrors screen caption "%m%d %c"
set -g status-left-length 30
set -g status-right ''
set -g window-status-format '#I#{window_flags}:#W'
set -g window-status-current-format '#I#{window_flags}:#W'
set -g window-status-current-style bold

# --- Last command output -> pager (C-e O) ---
# Relies on the OSC 133 prompt marks emitted by bash/bashrc.symlink's set_prompt.
# cursor-up (not previous-line) is required to exclude the next prompt line.
bind-key O {
  copy-mode
  send-keys -X previous-prompt -o
  send-keys -X begin-selection
  send-keys -X next-prompt
  send-keys -X cursor-up
  send-keys -X end-of-line
  send-keys -X copy-pipe-and-cancel 'cat > "${TMPDIR:-/tmp}/tmux-last-output"; tmux display-popup -E "less \"${TMPDIR:-/tmp}/tmux-last-output\""'
}
